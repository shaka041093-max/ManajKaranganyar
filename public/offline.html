<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tidak Ada Koneksi - Manajemen Desa Karanganyar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      color: #1e293b;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px rgba(15, 81, 50, 0.2);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0f5132;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.875rem;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    button {
      background: #0f5132;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.875rem 2rem;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <div class="icon">📡</div>
  <img src="/android-chrome-192x192.png" class="logo" alt="Karanganyar" onerror="this.style.display='none'" />
  <h1>Tidak Ada Koneksi</h1>
  <p>
    Sistem Manajemen Desa Karanganyar<br />
    memerlukan koneksi internet untuk bekerja.<br />
    Periksa koneksi Anda dan coba lagi.
  </p>
  <button onclick="window.location.reload()">🔄 &nbsp; Coba Lagi</button>
</body>

</html>
